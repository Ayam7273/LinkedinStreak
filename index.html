<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LinkedStreak</title>
  <meta name="description" content="A ledger for posting on LinkedIn every Friday, Saturday and Sunday.">

  <meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Streak">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&amp;display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">

  <script>
    // Apply the saved theme before first paint.
    try {
      var t = localStorage.getItem('ls2:theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="banner" id="offline" role="status" hidden>Offline. Showing what this device last saw.</div>
  <div id="app">
    <div class="shell">
      <header class="masthead frame">
        <div class="masthead__inner">
          <span class="wordmark">LinkedStreak</span>
        </div>
      </header>
      <main class="content frame content--bare" aria-busy="true">
        <span class="skeleton skeleton--hero"></span>
        <span class="skeleton"></span>
        <span class="skeleton skeleton--short"></span>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="frame">LinkedStreak needs JavaScript.</p></noscript>
</body>
</html>
