<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LinkedInStreak</title>
  <meta name="description" content="Your LinkedIn posting streak, verified.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LinkedInStreak">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="modulepreload" href="/js/app.js">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="app" aria-busy="true">
      <header class="appbar"><span class="skeleton skeleton--half"></span></header>
      <main class="main stack" aria-label="Loading">
        <span class="skeleton skeleton--card"></span>
        <span class="skeleton skeleton--lg"></span>
        <span class="skeleton skeleton--lg"></span>
      </main>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="prose">LinkedInStreak needs JavaScript to run.</p></noscript>
</body>
</html>
